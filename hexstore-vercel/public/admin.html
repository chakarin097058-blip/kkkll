<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEX Admin</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"><style>
:root{--p:#d8f01c;--line:#23231c;--card:#0d0d0b;--mut:#8f8f84}*{box-sizing:border-box}body{margin:0;background:#050505;color:#f4f4f0;font:300 15px/1.5 Kanit,sans-serif;padding:20px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:8px 16px;background:var(--p);color:#000;font-weight:600}button.g{background:#ffffff0a;color:#fff;border:1px solid var(--line)}button.g.on{border-color:var(--p);color:var(--p)}button.x{background:#e44;color:#fff}
input,textarea{background:#000;border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}.w{max-width:1000px;margin:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0}.mut{color:var(--mut)}.ok{color:var(--p)}.msg{color:#f66}
.ar{display:grid;grid-template-columns:50px 2fr 1fr 1fr 1fr 2fr 44px;gap:6px;margin-bottom:6px;min-width:760px}.sc{overflow-x:auto}.f{display:grid;gap:8px;max-width:520px}img.s{max-width:100%;border-radius:10px;margin-top:8px}
</style></head><body><div class="w" id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>'฿'+Number(n||0).toLocaleString('th-TH');
let K=sessionStorage.k||'',D=null,tab='orders',msg='',slips={};
const api=async(a,d={})=>{const r=await fetch('/api/api',{method:'POST',headers:{'content-type':'application/json','x-admin-key':K},body:JSON.stringify({a,...d})});const j=await r.json();if(!r.ok)throw new Error(j.e||'error');return j};
const load=async()=>{D=await api('a_all')};
function view(){if(!D)return '<h2>HEX Admin</h2><div class="f"><input id="k" type="password" placeholder="รหัสแอดมิน (ADMIN_KEY)"><button data-a="login">เข้าสู่ระบบ</button><p class="msg">'+esc(msg)+'</p></div>';
const T=[['orders','ออเดอร์ที่ต้องส่งของ'],['topups','ตรวจสลิปเติมเงิน'],['users','สมาชิก/เพิ่มคอยน์'],['products','สินค้า'],['settings','ตั้งค่าร้าน']];let b='';
if(tab==='orders')b=D.orders.map(o=>'<div class="li"><div class="row"><b>'+esc(o.item)+' × '+o.q+' — '+fmt(o.total)+'</b><span class="'+(o.s==='done'?'ok':'')+'">'+(o.s==='done'?'ส่งแล้ว':'รอส่ง')+'</span></div><small class="mut">'+esc(o.id)+' • ผู้ซื้อ: '+esc(o.n)+'</small><textarea data-o="'+o.id+'" placeholder="ใส่โค้ด/รายละเอียดสินค้าที่ส่งให้ลูกค้า">'+esc(o.d)+'</textarea><button data-a="deliver" data-v="'+o.id+'">'+(o.s==='done'?'อัปเดตข้อความ':'ส่งของ')+'</button></div>').join('')||'<p class="mut">ไม่มีออเดอร์</p>';
if(tab==='topups')b=D.topups.map(t=>'<div class="li"><div class="row"><b>'+esc(t.n)+' เติม '+fmt(t.amount)+'</b><span>'+t.s+'</span></div><small class="mut">'+new Date(t.ts).toLocaleString('th-TH')+'</small>'+(slips[t.id]?'<img class="s" src="'+slips[t.id]+'">':'')+'<div class="row"><button class="g" data-a="slip" data-v="'+t.id+'">ดูสลิป</button>'+(t.s==='pending'?'<span><button data-a="ok" data-v="'+t.id+'">อนุมัติ</button> <button class="x" data-a="no" data-v="'+t.id+'">ปฏิเสธ</button></span>':'')+'</div></div>').join('')||'<p class="mut">ไม่มีรายการ</p>';
if(tab==='users')b='<div class="li"><div class="row"><input id="cn" placeholder="ชื่อผู้ใช้"><input id="ca" type="number" placeholder="จำนวนคอยน์ (ลบได้)"><button data-a="coins">เพิ่มคอยน์</button></div></div>'+D.users.map(u=>'<div class="li row"><b>'+esc(u.n)+'</b><span>🪙 '+u.coins.toLocaleString()+'</span></div>').join('');
if(tab==='products')b='<div class="sc">'+D.pr.map(p=>'<div class="ar">'+['em','name','price','stock','cat','img'].map(k=>'<input data-p="'+p.id+'" data-k="'+k+'" '+(k==='price'||k==='stock'?'type="number" ':'')+'value="'+esc(p[k])+'">').join('')+'<button class="x" data-a="del" data-v="'+p.id+'">ลบ</button></div>').join('')+'</div><p class="mut">ไอคอน • ชื่อ • ราคา • สต็อก (999=ไม่จำกัด) • หมวด • ลิงก์รูป (ไม่บังคับ)</p><div class="row"><button class="g" data-a="new">+ เพิ่มสินค้า</button><button data-a="savep">บันทึก</button></div>';
if(tab==='settings')b='<div class="f">'+[['title','ชื่อร้าน'],['sub','ข้อความหน้าแรก'],['ann','ข้อความประกาศ'],['pp','เบอร์พร้อมเพย์/เลขบัตร ปชช. ของร้าน'],['contact','ช่องทางติดต่อ']].map(([k,l])=>'<label>'+l+'<input data-s="'+k+'" value="'+esc(D.st[k])+'"></label>').join('')+'<button data-a="saves">บันทึก</button></div>';
return '<h2>HEX Admin</h2><div class="tabs">'+T.map(([k,l])=>'<button class="g '+(k===tab?'on':'')+'" data-a="tab" data-v="'+k+'">'+l+'</button>').join('')+'<button class="g" data-a="out">ออก</button></div><p class="ok">'+esc(msg)+'</p>'+b}
const render=()=>{$('#app').innerHTML=view()};
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){const p=D.pr.find(x=>x.id==t.dataset.p),k=t.dataset.k;p[k]=k==='price'||k==='stock'?Number(t.value)||0:t.value}if(t.dataset.s)D.st[t.dataset.s]=t.value});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;msg='';
try{if(a==='login'){K=$('#k').value;sessionStorage.k=K;await load()}else if(a==='out'){K='';sessionStorage.k='';D=null}else if(a==='tab')tab=v;
else if(a==='deliver'){await api('a_deliver',{id:v,text:document.querySelector('[data-o="'+v+'"]').value});await load();msg='ส่งของแล้ว'}
else if(a==='slip'){slips[v]=(await api('a_slip',{id:v})).img}
else if(a==='ok'||a==='no'){await api('a_topup',{id:v,ok:a==='ok'});await load();msg=a==='ok'?'เพิ่มคอยน์ให้ลูกค้าแล้ว':'ปฏิเสธแล้ว'}
else if(a==='coins'){await api('a_coins',{n:$('#cn').value,amount:$('#ca').value});await load();msg='เพิ่มคอยน์แล้ว'}
else if(a==='new')D.pr.push({id:Date.now(),name:'สินค้าใหม่',price:0,stock:1,cat:'ทั่วไป',em:'📦',img:''});
else if(a==='del'){if(confirm('ลบสินค้า?'))D.pr=D.pr.filter(p=>p.id!=v)}
else if(a==='savep'){await api('a_save',{pr:D.pr});msg='บันทึกสินค้าแล้ว'}else if(a==='saves'){await api('a_save',{st:D.st});msg='บันทึกตั้งค่าแล้ว'}
}catch(err){msg=err.message;if(a==='login'){D=null}}render()});
(async()=>{if(K)try{await load()}catch(e){D=null}render()})();
</script></body></html>
