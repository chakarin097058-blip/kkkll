<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="siteTitle">HEX PRODUCT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style id="themeVars">
:root{--p:#d8f01c;--bg:#050505;--card:#0d0d0b;--line:#23231c;--mut:#8f8f84}
</style>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:#f4f4f0;font:300 16px/1.6 var(--font,Kanit),system-ui,sans-serif;background:var(--hero-img,none) center/cover no-repeat fixed,radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--p) 12%,transparent),transparent 70%),linear-gradient(#ffffff07 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,#ffffff07 1px,transparent 1px) 0 0/56px 56px,var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 20px;background:var(--p);color:#000;font-weight:600;transition:.15s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button.g{background:#ffffff0a;color:#fff;border:1px solid var(--line)}
button.g.on{border-color:var(--p);color:var(--p)}
button:disabled{opacity:.4}
input{background:#000;border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
input:focus{outline:1px solid var(--p)}
.w{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:#050505d9;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nv{display:flex;align-items:center;gap:10px;min-height:68px;flex-wrap:wrap}
.lg{font-weight:800;font-size:22px;letter-spacing:3px;margin-right:auto;cursor:pointer}
.lg b{color:var(--p)}.nv input{width:220px}
.hero{text-align:center;padding:90px 0 50px}
.bdg{display:inline-block;border:1px solid var(--p);color:var(--p);border-radius:99px;padding:3px 16px;font-size:13px;margin-bottom:18px}
h1{font-size:clamp(38px,9vw,84px);line-height:1.05;margin:0 0 16px;font-weight:800;letter-spacing:1px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--p),#7bd13a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:18px;max-width:600px;margin:0 auto 28px}
.hero .b{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:40px 0}
.st div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.st b{display:block;font-size:26px;color:var(--p)}
.tk{overflow:hidden;white-space:nowrap;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--card)}
.tk span{display:inline-block;padding-left:100%;animation:m 24s linear infinite;color:var(--mut)}
.tk b{color:var(--p)}@keyframes m{to{transform:translateX(-100%)}}
h2{font-size:30px;margin:56px 0 16px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,transparent),color-mix(in srgb,var(--card) 70%,#000));border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--p);transform:translateY(-4px);box-shadow:0 12px 40px color-mix(in srgb,var(--p) 10%,transparent)}
.im{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:64px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--p) 10%,transparent),#000 70%);border-radius:12px;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover}
.pr{color:var(--p);font-weight:800;font-size:20px}
small,.mut{color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.steps i{font-style:normal;display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--p);color:#000;align-items:center;justify-content:center;font-weight:800;margin-bottom:8px}
.ov{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:#0d0d0b;border:1px solid var(--line);border-radius:20px;padding:24px;width:min(480px,100%);max-height:92vh;overflow:auto}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
.f{display:grid;gap:10px}
#qr{background:#fff;padding:12px;border-radius:14px;width:fit-content;margin:12px auto}
.msg{color:#ff6b6b}.ok{color:var(--p)}
.li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
pre{white-space:pre-wrap;background:#000;border-radius:10px;padding:10px;margin:8px 0 0;user-select:all;border:1px solid var(--line)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--p);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--mut);padding:50px 0;margin-top:60px;border-top:1px solid var(--line)}
@media(max-width:640px){.nv input{width:100%;order:9}.st{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'฿'+Number(n||0).toLocaleString('th-TH');
const $=s=>document.querySelector(s);

let T=localStorage.t||'',me=null,D={pr:[],st:{}},cat='ทั้งหมด',q='',view='home',modal=null,cur=null,qty=1,tab='login',F={amt:100},msg='',mine=null,loading=false;

function applyTheme(st) {
  if (!st) return;
  const vars = document.getElementById('themeVars');
  if (vars) vars.textContent = `:root{--p:${st.colorPrimary||'#d8f01c'};--bg:${st.colorBg||'#050505'};--card:${st.colorCard||'#0d0d0b'};--line:#23231c;--mut:#8f8f84;--font:${st.fontFamily||'Kanit'}}`;
  if (st.heroImg) document.body.style.setProperty('--hero-img', `url("${st.heroImg}")`);
  else document.body.style.removeProperty('--hero-img');
  if (st.fontFamily) {
    const link = document.getElementById('fontLink');
    if (link) link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(st.fontFamily)}:wght@300;400;600;800&display=swap`;
  }
  if (st.title) document.getElementById('siteTitle').textContent = st.title;
}

const api=async(a,d={})=>{
  const r=await fetch('/api/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a,t:T,...d})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.e||'เกิดข้อผิดพลาด');
  return j;
};

const imgCache = {};

const tlv=(i,v)=>i+String(v.length).padStart(2,'0')+v;
function crc(s){let c=0xFFFF;for(const ch of s){c^=ch.charCodeAt(0)<<8;for(let i=0;i<8;i++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppay(id,amt){id=id.replace(/\D/g,'');const t=id.length>=13?'02':'01',v=id.length>=13?id:'0066'+id.replace(/^0/,'');const s=tlv('00','01')+tlv('01','12')+tlv('29',tlv('00','A000000677010111')+tlv(t,v))+tlv('53','764')+tlv('54',amt.toFixed(2))+tlv('58','TH')+'6304';return s+crc(s)}

function getImgEl(p) {
  if (!p.img) return `<span>${esc(p.em||'📦')}</span>`;
  if (p.img.startsWith('__redis:')) return `<img data-rid="${p.img.replace('__redis:img:','')}" alt="" style="width:100%;height:100%;object-fit:cover">`;
  return `<img src="${esc(p.img)}" alt="" style="width:100%;height:100%;object-fit:cover">`;
}

const card=p=>`<div class="card" data-a="open" data-v="${p.id}"><div class="im">${getImgEl(p)}</div><b>${esc(p.name)}</b><small>${esc(p.cat)} • เหลือ ${p.stock>=999?'∞':p.stock}</small><span class="pr">${fmt(p.price)}</span></div>`;

function nav(){
  const logoTxt = D.st.logoText || D.st.title || 'HEX PRODUCT';
  const parts = logoTxt.split(' ');
  const logoHtml = parts.length > 1 ? parts.slice(0,-1).join(' ') + ' <b>' + esc(parts[parts.length-1]) + '</b>' : `<b>${esc(logoTxt)}</b>`;
  return `<header><div class="w nv"><div class="lg" data-a="home">${logoHtml}</div><input id="q" placeholder="ค้นหาสินค้า..." value="${esc(q)}">${me?`<button class="g" data-a="orders">ออเดอร์</button><button data-a="wallet">🪙 ${Number(me.coins||0).toLocaleString()} เติมเงิน</button><button class="g" data-a="out">${esc(me.n)} ออก</button>`:`<button class="g" data-a="reg">สมัครสมาชิก</button><button data-a="log">เข้าสู่ระบบ</button>`}</div></header>`;
}

function home(){
  const st = D.st || {};
  const cs=['ทั้งหมด'].concat([...new Set(D.pr.map(p=>p.cat))]);
  const l=D.pr.filter(p=>(cat==='ทั้งหมด'||p.cat===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  const titleWords = (st.title||'HEX PRODUCT').split(' ');
  const h1 = titleWords.length>1 ? titleWords.slice(0,-1).join(' ') + ' <em>' + esc(titleWords[titleWords.length-1]) + '</em>' : `<em>${esc(st.title||'HEX PRODUCT')}</em>`;
  return `<div class="w"><div class="hero"><span class="bdg">● พร้อมให้บริการแล้ว</span><h1>${h1}</h1><p>${esc(st.sub||'')}</p><div class="b"><button data-a="goshop">เลือกซื้อสินค้า</button>${me?'':'<button class="g" data-a="reg">สมัครสมาชิกฟรี</button>'}</div></div>
  <div class="tk"><span><b>ประกาศ</b> &nbsp; ${esc(st.ann||'')}</span></div><div class="st"><div><b>${D.pr.length}</b>รายการสินค้า</div><div><b>24 ชม.</b>ส่งสินค้าไว</div><div><b>100%</b>ส่งจริง</div></div>
  <h2 id="shop">สินค้าทั้งหมด</h2><div class="chips">${cs.map(c=>`<button class="g ${c===cat?'on':''}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="grid">${l.map(card).join('')||'<p class="mut">ไม่พบสินค้า</p>'}</div>
  <h2>วิธีการซื้อ</h2><div class="steps">${['สมัครสมาชิก / เข้าสู่ระบบ','เติมคอยน์ สแกน QR แล้วแนบสลิป','กดซื้อสินค้าด้วยคอยน์','รับสินค้าในหน้าออเดอร์'].map((t,i)=>`<div><i>${i+1}</i><br>${t}</div>`).join('')}</div>
  </div><footer>© ${esc(st.title||'HEX PRODUCT')} • ${esc(st.contact||'')}</footer>`;
}

function orders(){
  if(!mine)return '<div class="w"><p class="mut"><span class="spin"></span>กำลังโหลด...</p></div>';
  const stt={pending:'รอส่งของ',done:'ส่งแล้ว ✅',approved:'อนุมัติแล้ว',rejected:'ไม่อนุมัติ'};
  return `<div class="w"><h2>ออเดอร์ของฉัน</h2>${mine.orders.map(o=>`<div class="li"><div class="row"><b>${esc(o.item)} × ${o.q}</b><span class="${o.s==='done'?'ok':''}">${stt[o.s]||o.s}</span></div><small>${esc(o.id)} • ${fmt(o.total)}</small>${o.d?`<pre>${esc(o.d)}</pre>`:''}</div>`).join('')||'<p class="mut">ยังไม่มีออเดอร์</p>'}
  <h2>ประวัติเติมคอยน์</h2>${mine.topups.map(t=>`<div class="li row"><span>${fmt(t.amount)} <small>${new Date(t.ts).toLocaleString('th-TH')}</small></span><span>${(stt[t.s]||t.s)}${t.s==='pending'?' (รอตรวจสลิป)':''}</span></div>`).join('')||'<p class="mut">-</p>'}</div>`;
}

function mod(){
  let b='';const X='<button class="g" data-a="close">✕</button>';
  if(modal==='prod'){
    const p=D.pr.find(x=>x.id==cur);
    if(!p){modal=null;return ''}
    b=`<div class="row"><b style="font-size:22px">${esc(p.name)}</b>${X}</div><div class="im" style="max-height:240px">${getImgEl(p)}</div><div class="row"><span class="pr" style="font-size:30px">${fmt(p.price)}</span><small>คงเหลือ ${p.stock>=999?'∞':p.stock}</small></div><p class="mut">ชำระด้วยคอยน์ในบัญชี • รับสินค้าที่หน้าออเดอร์ภายใน 24 ชม.</p><div class="row"><span>จำนวน</span><span><button class="g" data-a="qm">−</button> <b>${qty}</b> <button class="g" data-a="qp">+</button></span></div><div class="row"><b>รวม</b><b class="pr">${fmt(p.price*qty)}</b></div><p class="msg">${esc(msg)}</p><button style="width:100%" data-a="buy" ${p.stock<1?'disabled':''}>${p.stock<1?'สินค้าหมด':me?'ซื้อด้วยคอยน์':'เข้าสู่ระบบเพื่อซื้อ'}</button>`;
  }else if(modal==='auth'){
    b=`<div class="row"><b style="font-size:22px">${tab==='login'?'เข้าสู่ระบบ':'สมัครสมาชิก'}</b>${X}</div><div class="f"><input data-o="n" placeholder="ชื่อผู้ใช้ (a-z 0-9 _)" value="${esc(F.n||'')}"><input data-o="p" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" value="${esc(F.p||'')}"><p class="msg">${esc(msg)}</p><button data-a="auth" ${loading?'disabled':''}>${loading?'<span class="spin"></span>กำลังดำเนินการ...':tab==='login'?'เข้าสู่ระบบ':'สมัครสมาชิก'}</button><button class="g" data-a="tab">${tab==='login'?'ยังไม่มีบัญชี? สมัครสมาชิก':'มีบัญชีแล้ว? เข้าสู่ระบบ'}</button></div>`;
  }else if(modal==='wallet'){
    const a=Number(F.amt)||0;
    b=`<div class="row"><b style="font-size:22px">เติมคอยน์ (1 คอยน์ = 1 บาท)</b>${X}</div><div class="f"><input data-o="amt" type="number" min="1" value="${esc(F.amt)}" placeholder="จำนวนเงิน"><button class="g" data-a="qr">สร้าง QR พร้อมเพย์</button></div>${D.st.pp?(F.qr?`<div id="qr"></div><p class="mut" style="text-align:center">สแกนจ่าย ${fmt(a)} แล้วแนบสลิปด้านล่าง</p>`:''):'<p class="msg">ร้านยังไม่ได้ตั้งค่าเบอร์พร้อมเพย์</p>'}<div class="f"><input id="sl" type="file" accept="image/*"><p class="${msg==='ส่งสลิปแล้ว รอแอดมินตรวจสอบ'?'ok':'msg'}">${esc(msg)}</p><button data-a="slip" ${loading?'disabled':''}>${loading?'<span class="spin"></span>กำลังส่ง...':'ส่งสลิปให้แอดมินตรวจสอบ'}</button></div>`;
  }
  return `<div class="ov"><div class="md">${b}</div></div>`;
}

function render(){
  $('#app').innerHTML=nav()+(view==='orders'?orders():home())+(modal?mod():'');
  if(modal==='wallet'&&F.qr&&D.st.pp&&window.QRCode){
    const el=$('#qr');
    if(el&&!el.dataset.done){el.dataset.done='1';new QRCode(el,{text:ppay(D.st.pp,Number(F.amt)||0),width:220,height:220,colorDark:'#000',colorLight:'#fff'})}
  }
  document.querySelectorAll('[data-rid]').forEach(async img => {
    const rid = img.dataset.rid;
    if (imgCache[rid]) { img.src = imgCache[rid]; return; }
    try { const r = await api('img', { id: rid }); imgCache[rid] = r.img; img.src = r.img; } catch {}
  });
}

const shrink=f=>new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,900/i.width),cv=document.createElement('canvas');cv.width=Math.round(i.width*k);cv.height=Math.round(i.height*k);cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.75))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value;view='home';render();const n=$('#q');if(n){n.focus();n.setSelectionRange(q.length,q.length)}}
  else if(t.dataset.o){F[t.dataset.o]=t.value;if(t.dataset.o==='amt')F.qr=false}
});

document.addEventListener('click',async e=>{
  if(e.target.classList.contains('ov')){modal=null;render();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  msg='';
  try{
    if(a==='home'){view='home';modal=null;scrollTo(0,0)}
    else if(a==='goshop'){view='home';render();const s=$('#shop');if(s)s.scrollIntoView();return}
    else if(a==='cat')cat=v;
    else if(a==='open'){cur=v;qty=1;modal='prod'}
    else if(a==='close')modal=null;
    else if(a==='qp'){const p=D.pr.find(x=>x.id==cur);if(p&&qty<Math.min(p.stock>=999?99:p.stock,99))qty++}
    else if(a==='qm'){if(qty>1)qty--}
    else if(a==='log'||a==='reg'){tab=a==='log'?'login':'reg';modal='auth'}
    else if(a==='tab')tab=tab==='login'?'reg':'login';
    else if(a==='auth'){
      loading=true;render();
      const r=await api(tab==='login'?'login':'register',{n:F.n,p:F.p});
      loading=false;
      if(!r||!r.t||!r.me)throw new Error('เกิดข้อผิดพลาด กรุณาลองใหม่');
      T=r.t;localStorage.t=T;
      me={n:r.me.n,coins:Number(r.me.coins)||0};
      modal=null;F={amt:100};
    }
    else if(a==='out'){T='';localStorage.t='';me=null;view='home';mine=null}
    else if(a==='buy'){
      if(!me){tab='login';modal='auth'}
      else{
        loading=true;render();
        const r=await api('buy',{id:cur,q:qty});
        loading=false;
        me.coins=Number(r.coins)||0;
        const fresh=await api('shop');D=fresh;applyTheme(D.st);
        modal=null;
        alert('สั่งซื้อสำเร็จ! ✅\nดูสินค้าที่หน้า "ออเดอร์"');
      }
    }
    else if(a==='wallet'){modal='wallet';F.qr=false}
    else if(a==='qr'){if(Number(F.amt)>=1)F.qr=true}
    else if(a==='slip'){
      const f=$('#sl')&&$('#sl').files[0];
      if(!f){msg='กรุณาเลือกรูปสลิป'}
      else{loading=true;render();await api('topup',{amount:Number(F.amt),slip:await shrink(f)});loading=false;msg='ส่งสลิปแล้ว รอแอดมินตรวจสอบ'}
    }
    else if(a==='orders'){
      view='orders';mine=null;render();
      mine=await api('mine');
    }
  }catch(err){
    loading=false;
    msg=err.message;
    if(/เข้าสู่ระบบ/.test(msg)&&a!=='auth'){T='';localStorage.t='';me=null}
  }
  render();
});

(async()=>{
  try{
    const data=await api('shop');
    D=data;
    applyTheme(D.st);
  }catch(e){
    D={pr:[],st:{title:'HEX PRODUCT',sub:e.message,ann:'',contact:'',pp:''}};
  }
  render();
  if(T){
    try{
      const r=await api('me');
      if(r&&r.me){me={n:r.me.n,coins:Number(r.me.coins)||0}}
      else{T='';localStorage.t=''}
    }catch(_){T='';localStorage.t='';me=null}
    render();
  }
})();
</script>
</body>
</html>
